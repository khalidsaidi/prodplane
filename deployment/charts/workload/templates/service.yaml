{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    {{- include "workload.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
