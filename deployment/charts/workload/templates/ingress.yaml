{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}{{ fail "ingress requires service.enabled" }}{{- end }}
{{- $hosts := required "ingress.hosts must be supplied" .Values.ingress.hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workload.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.path | quote }}
            pathType: {{ $.Values.ingress.pathType | quote }}
            backend:
              service:
                name: {{ include "workload.fullname" $ | quote }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
